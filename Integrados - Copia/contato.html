						<input id="email" type="mail" placeholder="Digite seu e-mail" name="email"/>
						<P></P>
						<label for="opcao">O que você achou do aplicaivo?</label> <!--tipo RADIO marca somente uma opção-->
						<br>
						<input type="radio" name="opcao" value="otimo"/>Ótimo 
						<input type="radio" name="opcao" value="bom" checked="checked"/>Bom <!--CHECKED=deixa marcada como padrão a opção selecionada o checked-->
						<input type="radio" name="opcao" value="ruim"/>Ruim 
						<p></p>

						<textarea id="comented" name="msg" placeholder="Deixe seu comentário"></textarea> <!--a TEXTAREA é um campo maior de texto-->

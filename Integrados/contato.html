<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Integrados</title>
  <link rel="icon" href="img/int.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="topo">
    <a href="home.html"><img src="img/logo.png" title="Integrados" alt="Integrados"></a>
  </header>

  <nav id="menu">
    <a href="home.html">HOME</a>
    <a href="produto.html">PRODUTO</a>
    <a href="download.html">DOWNLOAD</a>
    <a href="contato.html" class="active">CONTATO</a>
  </nav>

  <main id="corpo">
    <div class="destaque">

      <div class="page-header">
        <h1>Contato</h1>
        <div class="divider"></div>
        <h2>Deixe sua marca, deixe sua opinião.</h2>
      </div>

      <div class="contact-wrapper">
        <div class="form-card">
          <form action="mensagem.html" method="post">

            <div class="form-group">
              <label for="nome">Nome completo</label>
              <input id="nome" type="text" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
              <label for="email">E-mail</label>
              <input id="email" type="email" name="email" placeholder="Digite seu e-mail">
            </div>

            <div class="form-group">
              <label>O que você achou do aplicativo?</label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="opcao" value="otimo"> Ótimo
                </label>
                <label class="radio-option">
                  <input type="radio" name="opcao" value="bom" checked> Bom
                </label>
                <label class="radio-option">
                  <input type="radio" name="opcao" value="ruim"> Ruim
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="comented">Comentário</label>
              <textarea id="comented" name="msg" placeholder="Deixe seu comentário sobre o Integrados"></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Mensagem</button>

          </form>
        </div>
      </div>

    </div>
  </main>

  <footer id="rodape">
    <span>© Integrados — Todos os Direitos Reservados</span>
    <div class="footer-social">
      <a href="https://www.facebook.com/" target="_blank" title="Seguir no Facebook">
        <img src="img/fb.png" alt="Facebook">
      </a>
      <a href="https://twitter.com/" target="_blank" title="Seguir no Twitter">
        <img src="img/twt.png" alt="Twitter">
      </a>
      <a href="https://plus.google.com/" target="_blank" title="Adicionar ao Google+">
        <img src="img/g+.png" alt="Google+">
      </a>
    </div>
  </footer>

</body>
</html>
